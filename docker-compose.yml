version: "3.9"

services:

  db:

    image: postgres:16

    restart: always

    environment:

      POSTGRES_DB: athena_db

      POSTGRES_USER: athena

      POSTGRES_PASSWORD: athena123

    ports:

      - "5432:5432"

    volumes:

      - postgres_data:/var/lib/postgresql/data

  redis:

    image: redis:7

    restart: always

    ports:

      - "6379:6379"

volumes:

  postgres_data:
# Formatter configuration shared by pre-commit, CI and editors.
# flake8 does not read pyproject.toml; its settings live in .flake8.

[tool.black]
line-length = 88
target-version = ["py313"]
# Migrations are generated by Django; leave their layout alone.
extend-exclude = '''
/(
    migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 88
skip_glob = ["*/migrations/*"]
known_first_party = ["apps", "config", "shared", "core", "infrastructure"]
